<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Ký Tài Khoản - CLB IT Zone</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <header>
        <div class="container navbar">
            <h1 class="logo"><i class="fa-solid fa-users-gear"></i> CLB IT ZONE</h1>
            <ul class="nav-links">
                <li><a href="index.html">Trang chủ</a></li>
                <li><a href="events.html">Sự kiện</a></li>
                <li><a href="login.html">Đăng nhập</a></li>
            </ul>
        </div>
    </header>

    <section class="section-padding" style="max-width: 450px; margin: 40px auto; background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1);">
        <h2 style="text-align: center; margin-bottom: 20px; color: #1e293b;">Đăng Ký Tài Khoản</h2>
        
        <form id="register-form">
            <div style="margin-bottom: 15px;">
                <label style="display: block; margin-bottom: 5px; font-weight: 600;">Họ và Tên:</label>
                <input type="text" id="fullname" placeholder="Nhập họ và tên..." required style="width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 5px; box-sizing: border-box;">
            </div>

            <div style="margin-bottom: 15px;">
                <label style="display: block; margin-bottom: 5px; font-weight: 600;">Tên đăng nhập / Email:</label>
                <input type="text" id="username" placeholder="Nhập tên đăng nhập hoặc email..." required style="width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 5px; box-sizing: border-box;">
            </div>

            <div style="margin-bottom: 20px;">
                <label style="display: block; margin-bottom: 5px; font-weight: 600;">Mật khẩu:</label>
                <input type="password" id="password" placeholder="Nhập mật khẩu..." required style="width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 5px; box-sizing: border-box;">
            </div>

            <button type="submit" style="width: 100%; padding: 12px; background: #2563eb; color: white; border: none; border-radius: 5px; font-weight: bold; cursor: pointer;">Đăng Ký Tài Khoản</button>
        </form>

        <p style="text-align: center; margin-top: 15px; font-size: 0.9rem;">
            Đã có tài khoản? <a href="login.html" style="color: #2563eb; text-decoration: none; font-weight: bold;">Đăng nhập ngay</a>
        </p>
    </section>

    <script src="assets/js/register.js"></script>
</body>
</html>
