<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Ký Gia Nhập - CLB IT Zone</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <!-- HEADER -->
    <header class="header">
        <div class="container navbar">
            <a href="index.html" class="logo">
                <i class="fa-solid fa-users-gear"></i> CLB IT ZONE
            </a>
            <nav class="nav-menu">
                <ul>
                    <li><a href="index.html">Trang chủ</a></li>
                    <li><a href="register.html" class="btn-register">Gia nhập CLB</a></li>
                    <li><a href="login.html" class="btn-login">Đăng nhập</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <!-- FORM ĐĂNG KÝ -->
    <section class="section-padding">
        <div class="container">
            <div class="form-container">
                <h2 class="section-title">Đơn Đăng Ký Gia Nhập CLB</h2>
                <p class="form-subtitle">Hãy điền đầy đủ thông tin bên dưới để trở thành thành viên của CLB IT Zone!</p>
                
                <form id="register-form">
                    <div class="form-group">
                        <label for="fullname">Họ và Tên (*)</label>
                        <input type="text" id="fullname" placeholder="Ví dụ: Nguyễn Văn A" required>
                    </div>

                    <div class="form-group">
                        <label for="student-id">Mã Số Sinh Viên (*)</label>
                        <input type="text" id="student-id" placeholder="Ví dụ: 22110001" required>
                    </div>

                    <div class="form-group">
                        <label for="email">Email Sinh Viên (*)</label>
                        <input type="email" id="email" placeholder="example@student.edu.vn" required>
                    </div>

                    <div class="form-group">
                        <label for="phone">Số Điện Thoại (*)</label>
                        <input type="tel" id="phone" placeholder="0901234567" required>
                    </div>

                    <div class="form-group">
                        <label for="department">Ban Mong Muốn Gia Nhập (*)</label>
                        <select id="department" required>
                            <option value="">-- Chọn Ban --</option>
                            <option value="Ban Lập Trình">Ban Lập Trình & Học Thuật</option>
                            <option value="Ban Truyền Thông">Ban Truyền Thông & Event</option>
                            <option value="Ban Tài Chính">Ban Tài Chính & Nhân Sự</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="note">Lý Do Muốn Gia Nhập CLB</label>
                        <textarea id="note" rows="4" placeholder="Chia sẻ một chút về định hướng hoặc mong muốn của bạn..."></textarea>
                    </div>

                    <button type="submit" class="btn btn-primary btn-full">Gửi Đơn Đăng Ký</button>
                </form>

                <div id="register-message" class="message-box"></div>
            </div>
        </div>
    </section>

    <!-- FOOTER -->
    <footer class="footer">
        <div class="container footer-bottom">
            <p>&copy; 2026 CLB IT Zone. Bài tiểu luận môn Lập trình Web.</p>
        </div>
    </footer>

    <script src="assets/js/main.js"></script>
    <script src="assets/js/register.js"></script>
</body>
</html>
